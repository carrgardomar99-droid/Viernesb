<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YARBIS System</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { 
            background: #0d1117; 
            color: #58a6ff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        .panel { 
            border: 1px solid #30363d; 
            padding: 30px; 
            border-radius: 15px; 
            background: #161b22; 
            max-width: 400px; 
            margin: 50px auto;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #58a6ff; font-size: 2rem; margin-bottom: 5px; }
        .status { color: #238636; font-weight: bold; font-size: 0.9rem; margin-bottom: 20px; }
        button { 
            background: #238636; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 1rem;
            margin: 10px;
            transition: background 0.3s;
        }
        button:hover { background: #2ea043; }
        .btn-voz { background: #1f6feb; }
        .btn-voz:hover { background: #388bfd; }
        .datos { margin-top: 20px; font-size: 1.1rem; color: #c9d1d9; line-height: 1.6; }
        #escucha { color: #58a6ff; font-style: italic; font-size: 0.95rem; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>YARBIS</h1>
        <div class="status">● SISTEMA ONLINE</div>
        
        <p id="reloj" class="datos">Cargando tiempo...</p>
        <p id="fecha" class="datos">Cargando fecha...</p>
        
        <button onclick="obtenerUbicacion()">Consultar Sensores</button>
        <button class="btn-voz" onclick="activarVoz()">Activar Comando de Voz</button>
        
        <p id="escucha"></p>
        <p id="ubicacion" class="datos"></p>
    </div>

    <script>
        // Reloj y fecha en tiempo real
        function actualizarTiempo() {
            const ahora = new Date();
            document.getElementById('reloj').innerText = "Hora: " + ahora.toLocaleTimeString('es-MX');
            const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('fecha').innerText = ahora.toLocaleDateString('es-MX', opcionesFecha);
        }
        setInterval(actualizarTiempo, 1000);
        actualizarTiempo();

        // Conexión con el sensor de geolocalización
        function obtenerUbicacion() {
            const ubicacionInfo = document.getElementById('ubicacion');
            ubicacionInfo.innerText = "Accediendo a los sensores...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (posicion) => {
                        const lat = posicion.coords.latitude.toFixed(4);
                        const lon = posicion.coords.longitude.toFixed(4);
                        ubicacionInfo.innerHTML = `<strong>Ubicación actual:</strong><br>Latitud: ${lat}<br>Longitud: ${lon}`;
                    }, 
                    () => { ubicacionInfo.innerText = "Error: Permiso de ubicación denegado."; }
                );
            } else {
                ubicacionInfo.innerText = "Tu dispositivo no soporta este sensor.";
            }
        }

        // Protocolo de Voz Nacio de YARBIS
        function activarVoz() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta comandos de voz.");
                return;
            }

            const reconocimiento = new SpeechRecognition();
            reconocimiento.lang = 'es-MX';
            reconocimiento.interimResults = false;

            document.getElementById('escucha').innerText = "Escuchando, Jefe...";

            reconocimiento.onresult = (evento) => {
                const comando = evento.results[0][0].transcript.toLowerCase();
                document.getElementById('escucha').innerText = `Entendido: "${comando}"`;
                
                // Procesar la orden de Omar
                if (comando.includes("sensores") || comando.includes("ubicación") || comando.includes("dónde estoy")) {
                    obtenerUbicacion();
                }
            };

            reconocimiento.onerror = () => {
                document.getElementById('escucha').innerText = "No logré escuchar el comando.";
            };

            reconocimiento.onend = () => {
                if(document.getElementById('escucha').innerText === "Escuchando, Jefe...") {
                    document.getElementById('escucha').innerText = "";
                }
            };

            reconocimiento.start();
        }

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log("SW error", err));
        }
    </script>
</body>
</html>
