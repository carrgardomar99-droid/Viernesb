<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YARBIS System</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { 
            background: #080b10; 
            color: #58a6ff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
            overflow-x: hidden;
        }
        .panel { 
            border: 1px solid #1f293d; 
            padding: 30px; 
            border-radius: 20px; 
            background: rgba(22, 27, 34, 0.8); 
            max-width: 400px; 
            margin: 30px auto;
            box-shadow: 0px 0px 25px rgba(24, 113, 247, 0.2);
            backdrop-filter: blur(10px);
        }
        h1 { color: #58a6ff; font-size: 2.2rem; margin-bottom: 5px; letter-spacing: 3px; }
        .status { color: #00ffaa; font-weight: bold; font-size: 0.85rem; margin-bottom: 20px; letter-spacing: 1px; }
        
        .contenedor-nucleo {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .anillo-exterior {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 3px dashed #1f6feb;
            border-radius: 50%;
            animation: rotarDerecha 10s linear infinite;
            box-shadow: 0 0 15px rgba(31, 111, 235, 0.3);
        }
        .anillo-intermedio {
            position: absolute;
            width: 140px;
            height: 140px;
            border: 2px dashed #00d2ff;
            border-top: 2px solid transparent;
            border-bottom: 2px solid transparent;
            border-radius: 50%;
            animation: rotarIzquierda 6s linear infinite;
        }
        .nucleo-centro {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #00d2ff 0%, #1f6feb 70%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 30px #00d2ff;
            animation: pulsoRespiracion 3s ease-in-out infinite;
            transition: all 0.3s ease;
        }
        .ondas-contenedor {
            display: none;
            position: absolute;
            width: 120px;
            height: 60px;
            justify-content: space-between;
            align-items: center;
        }
        .barra-onda {
            width: 6px;
            height: 10px;
            background-color: #00ffaa;
            border-radius: 3px;
            box-shadow: 0 0 10px #00ffaa;
        }

        @keyframes rotarDerecha { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes rotarIzquierda { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
        @keyframes pulsoRespiracion {
            0%, 100% { transform: scale(0.9); opacity: 0.7; box-shadow: 0 0 20px #1f6feb; }
            50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 40px #00d2ff; }
        }
        @keyframes picosSonido { 0%, 100% { height: 10px; } 50% { height: 55px; } }

        .datos { margin-top: 15px; font-size: 1rem; color: #c9d1d9; line-height: 1.5; }
        #escucha { color: #00ffaa; font-style: italic; font-size: 1rem; margin-top: 15px; min-height: 24px; }
        
        /* --- LA CONSOLA TÁCTICA RECUPERADA --- */
        .ia-status {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #21262d;
            border-radius: 10px;
            padding: 15px;
            font-size: 0.9rem;
            color: #8b949e;
            margin-top: 20px;
            text-align: left;
            font-family: monospace;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .linea-consola { margin-bottom: 5px; }
        .tag-ok { color: #00ffaa; font-weight: bold; }
        .tag-info { color: #58a6ff; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>YARBIS</h1>
        <div class="status" id="estadoTexto">● NÚCLEO ESTABLE</div>
        
        <div class="contenedor-nucleo" onclick="protocoloInicial()">
            <div class="anillo-exterior" id="anilloExt"></div>
            <div class="anillo-intermedio" id="anilloInt"></div>
            <div class="nucleo-centro" id="reactorCentro"></div>
            
            <div class="ondas-contenedor" id="ondasVoz">
                <div class="barra-onda" style="animation: picosSonido 0.5s ease infinite 0.1s;"></div>
                <div class="barra-onda" style="animation: picosSonido 0.4s ease infinite 0.3s;"></div>
                <div class="barra-onda" style="animation: picosSonido 0.6s ease infinite 0.0s;"></div>
                <div class="barra-onda" style="animation: picosSonido 0.3s ease infinite 0.2s;"></div>
                <div class="barra-onda" style="animation: picosSonido 0.5s ease infinite 0.4s;"></div>
            </div>
        </div>
        
        <p id="reloj" class="datos">Cargando tiempo...</p>
        <p id="fecha" class="datos">Cargando fecha...</p>
        <p id="escucha"></p>
        
        <div class="ia-status">
            <div class="linea-consola"><span class="tag-info">[SISTEMA]:</span> RAG-Search Core v2.5</div>
            <div class="linea-consola" id="iaFiltro"><span class="tag-ok">[FILTRO]:</span> Esperando entrada de Omar...</div>
            <div class="linea-consola" id="iaExtra"></div>
        </div>
        
        <p id="ubicacion" class="datos"></p>
    </div>

    <script>
        function actualizarTiempo() {
            const ahora = new Date();
            document.getElementById('reloj').innerText = "Hora: " + ahora.toLocaleTimeString('es-MX');
            const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('fecha').innerText = ahora.toLocaleDateString('es-MX', opcionesFecha);
        }
        setInterval(actualizarTiempo, 1000);
        actualizarTiempo();

        function responder(texto, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const lectura = new SpeechSynthesisUtterance(texto);
                lectura.lang = 'es-MX';
                lectura.rate = 1.0;
                if (callback) { lectura.onend = () => { callback(); }; }
                window.speechSynthesis.speak(lectura);
            } else if (callback) {
                callback();
            }
        }

        function protocoloInicial() {
            document.getElementById('escucha').innerText = "Iniciando protocolo...";
            responder("Viernes lista para trabajar con usted, ¿qué haremos hoy?", activarEscuchaReal);
        }

        function activarEscuchaReal() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            const reconocimiento = new SpeechRecognition();
            reconocimiento.lang = 'es-MX';
            reconocimiento.interimResults = false;

            const reactor = document.getElementById('reactorCentro');
            const ondas = document.getElementById('ondasVoz');
            const ext = document.getElementById('anilloExt');
            const interior = document.getElementById('anilloInt');

            reactor.style.background = "none";
            reactor.style.boxShadow = "none";
            reactor.style.animation = "none";
            ext.style.animation = "rotarDerecha 1.2s linear infinite";
            interior.style.animation = "rotarIzquierda 0.6s linear infinite";
            ondas.style.display = "flex";
            document.getElementById('estadoTexto').innerText = "● ESCUCHANDO ORDEN";
            document.getElementById('escucha').innerText = "Hable ahora, Jefe...";

            reconocimiento.onresult = (evento) => {
                const comando = evento.results[0][0].transcript.toLowerCase().trim();
                document.getElementById('escucha').innerText = `Entendido: "${comando}"`;
                analizarComandoInteligente(comando);
            };

            reconocimiento.onend = () => {
                ondas.style.display = "none";
                reactor.style.background = "radial-gradient(circle, #00d2ff 0%, #1f6feb 70%, transparent 100%)";
                reactor.style.boxShadow = "0 0 30px #00d2ff";
                reactor.style.animation = "pulsoRespiracion 3s ease-in-out infinite";
                ext.style.animation = "rotarDerecha 10s linear infinite";
                interior.style.animation = "rotarIzquierda 6s linear infinite";
                document.getElementById('estadoTexto').innerText = "● NÚCLEO ESTABLE";
            };

            reconocimiento.start();
        }

        function analizarComandoInteligente(frase) {
            const filtroLog = document.getElementById('iaFiltro');
            const extraLog = document.getElementById('iaExtra');
            
            // Comandos de Análisis de Motores de Búsqueda y Veracidad
            if (frase.includes("busca") || frase.includes("investiga") || frase.includes("qué es")) {
                filtroLog.innerHTML = "<span style='color: #00ffaa;'>[CONECTANDO] Integrando Google & Gemini...</span>";
                extraLog.innerHTML = "<span style='color: #58a6ff;'>[ESTADO]: Recogiendo datos en tiempo real.</span>";
                
                setTimeout(() => {
                    responder("Consulta procesada en la red de manera exitosa, Jefe.");
                }, 1000);
            } 
            else if (frase.includes("es verdad") || frase.includes("falso")) {
                filtroLog.innerHTML = "<span style='color: #ffaa00;'>[FILTRO]: Evaluando veracidad del hecho...</span>";
                extraLog.innerHTML = "<span style='color: #ff3333;'>[DISCERNIMIENTO]: Análisis anti-fake-news activo.</span>";
                
                setTimeout(() => {
                    responder("He contrastado la información. Mis motores indican un alto índice de datos falsos en esa premisa, Omar.");
                }, 1000);
            }
            else if (frase.includes("actualízate")) {
                filtroLog.innerHTML = "<span style='color: #00ffaa;'>[FILTRO]: Purgando historial atrasado.</span>";
                extraLog.innerHTML = "<span style='color: #00ffaa;'>[ESTADO]: Sincronizado al segundo actual.</span>";
                actualizarTiempo();
                setTimeout(() => {
                    responder("Base de datos e información local actualizadas al instante, Jefe.");
                }, 1000);
            }
            // MÓDULOS DE INFORMACIÓN ÚTIL (Tarea 3 - Adelanto Táctico)
            else if (frase.includes("abre google")) {
                filtroLog.innerHTML = "<span style='color: #00ffaa;'>[EJECUTANDO]: Desplegando navegador...</span>";
                responder("Abriendo el motor de búsqueda, Jefe.", () => {
                    window.open('https://www.google.com', '_blank');
                });
            }
            else if (frase.includes("abre mapas") || frase.includes("abre el mapa")) {
                filtroLog.innerHTML = "<span style='color: #00ffaa;'>[EJECUTANDO]: Desplegando posicionamiento...</span>";
                responder("Abriendo Google Maps en un entorno externo, Omar.", () => {
                    window.open('https://maps.google.com', '_blank');
                });
            }
            else if (frase.includes("cómo estás") || frase.includes("cómo va todo")) {
                responder("Me encuentro operando al cien por ciento de mi capacidad, Jefe.");
            } else if (frase === "viernes") {
                responder("A sus órdenes, Jefe.");
            } else {
                responder("Comando procesado a través del núcleo inteligente.");
            }
        }
    </script>
</body>
</html>
