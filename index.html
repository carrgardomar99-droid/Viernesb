<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YARBIS System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0a0f1d;
            color: #00f3ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: linear-gradient(180deg, #0e172c 0%, #0a0f1d 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #00f3ff;
            box-shadow: 0px 0px 15px rgba(0, 243, 255, 0.3);
        }
        h1 { font-size: 1.8rem; letter-spacing: 3px; text-transform: uppercase; }
        .status { font-size: 0.9rem; color: #00ff87; margin-top: 5px; }
        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .msg { padding: 12px 16px; border-radius: 10px; max-width: 85%; font-size: 1rem; line-height: 1.4; }
        .yarbis { background: rgba(0, 243, 255, 0.1); border-left: 4px solid #00f3ff; align-self: flex-start; }
        .user { background: rgba(0, 255, 135, 0.1); border-right: 4px solid #00ff87; align-self: flex-end; color: #00ff87; }
        #input-area {
            padding: 15px;
            background: #0e172c;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(0, 243, 255, 0.2);
        }
        input {
            flex: 1;
            background: #050814;
            border: 1px solid #00f3ff;
            padding: 12px;
            color: #fff;
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
        }
        button {
            background: #00f3ff;
            color: #0a0f1d;
            border: none;
            padding: 0 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #00ff87; box-shadow: 0 0 10px #00ff87; }
    </style>
</head>
<body>

    <header>
        <h1>YARBIS</h1>
        <div class="status" id="activation-msg">Viernes lista para trabajar con usted, ¿qué haremos hoy?</div>
    </header>

    <div id="chat-container">
        <div class="msg yarbis">Sistemas en línea, Jefe. Protocolos de Veracidad y Conciencia de Datos inicializados.</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Escriba un comando, Jefe u Omar..." onkeypress="checkEnter(event)">
        <button onclick="sendCommand()">Enviar</button>
    </div>

    <script>
        function checkEnter(event) {
            if (event.key === 'Enter') sendCommand();
        }

        function sendCommand() {
            const input = document.getElementById('user-input');
            const messageText = input.value.trim();
            if (messageText === '') return;

            // Mostrar mensaje del usuario
            appendMessage(messageText, 'user');
            input.value = '';

            // Procesar comando de sensores (Conciencia de Datos)
            const textLower = messageText.toLowerCase();
            if (textLower.includes('sensores') || textLower.includes('ubicacion') || textLower.includes('dónde estoy') || textLower.includes('hora')) {
                obtenerDatosSensores();
            } else {
                // Respuesta por defecto simulada temporalmente
                setTimeout(() => {
                    appendMessage("Entendido, Jefe. Estoy procesando su solicitud en el núcleo.", 'yarbis');
                }, 800);
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg', sender);
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function obtenerDatosSensores() {
            appendMessage("Accediendo a los sensores del dispositivo...", 'yarbis');
            
            const ahora = new Date();
            const fecha = ahora.toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const hora = ahora.toLocaleTimeString('es-MX');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(4);
                        const lon = position.coords.longitude.toFixed(4);
                        appendMessage(`[CONCIENCIA DE DATOS]\nFecha: ${fecha}\nHora Exacta: ${hora}\nUbicación actual: Latitud ${lat}, Longitud ${lon}`, 'yarbis');
                    },
                    (error) => {
                        appendMessage(`[CONCIENCIA DE DATOS]\nFecha: ${fecha}\nHora Exacta: ${hora}\nUbicación: No se pudo acceder al GPS (Verifique los permisos).`, 'yarbis');
                    }
                );
            } else {
                appendMessage(`[CONCIENCIA DE DATOS]\nFecha: ${fecha}\nHora Exacta: ${hora}\nUbicación: El navegador no soporta GPS.`, 'yarbis');
            }
        }
    </script>
</body>
</html>
