<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YARBIS System</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { 
            background: #080b10; 
            color: #58a6ff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
            overflow-x: hidden;
        }
        .panel { 
            border: 1px solid #1f293d; 
            padding: 30px; 
            border-radius: 20px; 
            background: rgba(22, 27, 34, 0.8); 
            max-width: 400px; 
            margin: 30px auto;
            box-shadow: 0px 0px 25px rgba(24, 113, 247, 0.2);
            backdrop-filter: blur(10px);
        }
        h1 { color: #58a6ff; font-size: 2.2rem; margin-bottom: 5px; letter-spacing: 3px; }
        .status { color: #00ffaa; font-weight: bold; font-size: 0.85rem; margin-bottom: 20px; letter-spacing: 1px; }
        
        /* --- CONTENEDOR DEL NÚCLEO JARVIS --- */
        .contenedor-nucleo {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Anillo Exterior (Giro a la derecha) */
        .anillo-exterior {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 3px dashed #1f6feb;
            border-radius: 50%;
            animation: rotarDerecha 10s linear infinite;
            box-shadow: 0 0 15px rgba(31, 111, 235, 0.3);
        }

        /* Anillo Intermedio (Giro a la izquierda) */
        .anillo-intermedio {
            position: absolute;
            width: 140px;
            height: 140px;
            border: 2px dashed #00d2ff;
            border-top: 2px solid transparent;
            border-bottom: 2px solid transparent;
            border-radius: 50%;
            animation: rotarIzquierda 6s linear infinite;
        }

        /* Centro de Pulso o Respiración */
        .nucleo-centro {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #00d2ff 0%, #1f6feb 70%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 30px #00d2ff;
            animation: pulsoRespiracion 3s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        /* ONDAS DE SONIDO MODO ACTIVO (Ocultas al inicio) */
        .ondas-contenedor {
            display: none;
            position: absolute;
            width: 120px;
            height: 60px;
            justify-content: space-between;
            align-items: center;
        }
        .barra-onda {
            width: 6px;
            height: 10px;
            background-color: #00ffaa;
            border-radius: 3px;
            box-shadow: 0 0 10px #00ffaa;
        }

        /* --- ESTADOS DE ANIMACIÓN --- */
        @keyframes rotarDerecha {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotarIzquierda {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        @keyframes pulsoRespiracion {
            0%, 100% { transform: scale(0.9); opacity: 0.7; box-shadow: 0 0 20px #1f6feb; }
            50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 40px #00d2ff; }
        }
        @keyframes picosSonido {
            0%, 100% { height: 10px; }
            50% { height: 55px; }
        }

        .datos { margin-top: 15px; font-size: 1rem; color: #c9d1d9; line-height: 1.5; }
        #escucha { color: #00ffaa; font-style: italic; font-size: 1rem; margin-top: 15px; min-height: 24px; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>YARBIS</h1>
        <div class="status">● NÚCLEO ESTABLE</div>
        
        <div class="contenedor-nucleo" onclick="activarVoz()">
            <div class="anillo-exterior" id="anilloExt"></div>
            <div class="anillo-intermedio" id="anilloInt"></div>
            <div class="nucleo-centro" id="reactorCentro"></div>
            
            <div class="ondas-contenedor" id="ondasVoz">
                <div class="barra-onda" style="animation: picosSonido 0.5s ease infinite 0.1s;"></div>
                <div class="barra-onda" style="animation: picosSonido 0.4s ease infinite 0.3s;"></div>
                <div class="barra-onda" style="animation: picosSonido 0.6s ease infinite 0.0s;"></div>
                <div class="barra-onda" style="animation: picosSonido 0.3s ease infinite 0.2s;"></div>
                <div class="barra-onda" style="animation: picosSonido 0.5s ease infinite 0.4s;"></div>
            </div>
        </div>
        
        <p id="reloj" class="datos">Cargando tiempo...</p>
        <p id="fecha" class="datos">Cargando fecha...</p>
        <p id="escucha"></p>
        <p id="ubicacion" class="datos"></p>
    </div>

    <script>
        // Reloj y fecha
        function actualizarTiempo() {
            const ahora = new Date();
            document.getElementById('reloj').innerText = "Hora: " + ahora.toLocaleTimeString('es-MX');
            const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('fecha').innerText = ahora.toLocaleDateString('es-MX', opcionesFecha);
        }
        setInterval(actualizarTiempo, 1000);
        actualizarTiempo();

        // Salida de audio
        function responder(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const lectura = new SpeechSynthesisUtterance(texto);
                lectura.lang = 'es-MX';
                lectura.rate = 1.0;
                window.speechSynthesis.speak(lectura);
            }
        }

        // Sensor de Ubicación
        function obtenerUbicacion() {
            const ubicacionInfo = document.getElementById('ubicacion');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (posicion) => {
                        const lat = posicion.coords.latitude.toFixed(4);
                        const lon = posicion.coords.longitude.toFixed(4);
                        ubicacionInfo.innerHTML = `<strong>Ubicación:</strong> Lat ${lat} | Lon ${lon}`;
                        responder("Sensores consultados de manera exitosa, Jefe.");
                    }, 
                    () => { responder("Acceso a sensores denegado, Omar."); }
                );
            }
        }

        // Protocolo de Voz Interactiva y Cambio de Animación
        function activarVoz() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            const reconocimiento = new SpeechRecognition();
            reconocimiento.lang = 'es-MX';
            reconocimiento.interimResults = false;

            // Elementos visuales del Reactor Arc
            const reactor = document.getElementById('reactorCentro');
            const ondas = document.getElementById('ondasVoz');
            const ext = document.getElementById('anilloExt');
            const interior = document.getElementById('anilloInt');

            // --- PASAR A MODO ACTIVO (Ondas y picos de sonido de neón) ---
            reactor.style.background = "none";
            reactor.style.boxShadow = "none";
            reactor.style.animation = "none";
            ext.style.animation = "rotarDerecha 1s linear infinite"; // Acelera giro exterior
            interior.style.animation = "rotarIzquierda 0.5s linear infinite"; // Acelera giro interior
            ondas.style.display = "flex"; // Muestra las barras saltando

            document.getElementById('escucha').innerText = "Escuchando, Jefe...";
            responder("Viernes lista para trabajar con usted, ¿qué haremos hoy?");

            reconocimiento.onresult = (evento) => {
                const comando = evento.results[0][0].transcript.toLowerCase();
                document.getElementById('escucha').innerText = `Entendido: "${comando}"`;
                
                if (comando.includes("sensores") || comando.includes("ubicación") || comando.includes("dónde estoy")) {
                    obtenerUbicacion();
                } else if (comando.includes("cómo estás") || comando.includes("cómo va todo")) {
                    responder("Me encuentro operando al cien por ciento de mi capacidad. Todos los módulos están estables y listos para usted, Jefe.");
                } else if (comando === "viernes") {
                    responder("A sus órdenes, Jefe. Monitoreando los sistemas locales y esperando sus instrucciones.");
                } else if (comando.includes("estado del sistema") || comando.includes("reporte")) {
                    const horaActual = new Date().toLocaleTimeString('es-MX');
                    responder(`Reporte actual. Servidores en GitHub Pages en línea. Son las ${horaActual} y el entorno se encuentra seguro.`);
                } else if (comando.includes("descansa") || comando.includes("modo de espera")) {
                    responder("Entendido, Jefe. Colocando la interfaz en segundo plano.");
                } else {
                    responder("Comando recibido, Jefe, pero carezco de instrucciones de ejecución.");
                }
            };

            // --- REGRESAR A MODO DE ESPERA (Pulso y respiración azul) ---
            reconocimiento.onend = () => {
                ondas.style.display = "none";
                reactor.style.background = "radial-gradient(circle, #00d2ff 0%, #1f6feb 70%, transparent 100%)";
                reactor.style.boxShadow = "0 0 30px #00d2ff";
                reactor.style.animation = "pulsoRespiracion 3s ease-in-out infinite";
                ext.style.animation = "rotarDerecha 10s linear infinite";
                interior.style.animation = "rotarIzquierda 6s linear infinite";
                if(document.getElementById('escucha').innerText === "Escuchando, Jefe...") {
                    document.getElementById('escucha').innerText = "";
                }
            };

            reconocimiento.onerror = () => {
                document.getElementById('escucha').innerText = "Conexión interrumpida.";
            };

            reconocimiento.start();
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log("SW error", err));
        }
    </script>
</body>
</html>
